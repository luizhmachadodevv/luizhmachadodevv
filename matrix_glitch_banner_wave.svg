<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#001f0f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Wavy panel shape: dark area fades into the page at the bottom -->
    <path id="wavePath" d="M0,0 L900,0 L900,150 C 760,205 640,150 500,175 C 360,200 220,150 90,180 C 55,188 25,178 0,190 Z"/>
    <clipPath id="waveClip">
      <use href="#wavePath"/>
    </clipPath>
  </defs>

  <!-- Dark matrix panel, wavy bottom edge -->
  <use href="#wavePath" fill="url(#bgGrad)"/>

  <g clip-path="url(#waveClip)">
    <!-- Matrix rain columns -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00ff41" opacity="0.5">
      <text x="10" y="0"><tspan x="10" dy="18">ﾊ</tspan><tspan x="10" dy="18">ﾐ</tspan><tspan x="10" dy="18">0</tspan><tspan x="10" dy="18">1</tspan><tspan x="10" dy="18">ﾃ</tspan><tspan x="10" dy="18">ｹ</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-160;0,220" dur="3.1s" repeatCount="indefinite"/>
      </text>
      <text x="45" y="0"><tspan x="45" dy="18">ｦ</tspan><tspan x="45" dy="18">1</tspan><tspan x="45" dy="18">0</tspan><tspan x="45" dy="18">ﾂ</tspan><tspan x="45" dy="18">ｳ</tspan><tspan x="45" dy="18">ﾈ</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-200;0,220" dur="2.4s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="0"><tspan x="80" dy="18">0</tspan><tspan x="80" dy="18">ﾏ</tspan><tspan x="80" dy="18">1</tspan><tspan x="80" dy="18">ﾔ</tspan><tspan x="80" dy="18">ﾕ</tspan><tspan x="80" dy="18">ﾖ</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-120;0,220" dur="2.8s" repeatCount="indefinite"/>
      </text>
      <text x="115" y="0"><tspan x="115" dy="18">ﾗ</tspan><tspan x="115" dy="18">0</tspan><tspan x="115" dy="18">ﾘ</tspan><tspan x="115" dy="18">1</tspan><tspan x="115" dy="18">ﾙ</tspan><tspan x="115" dy="18">ﾚ</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-180;0,220" dur="3.6s" repeatCount="indefinite"/>
      </text>
      <text x="800" y="0"><tspan x="800" dy="18">1</tspan><tspan x="800" dy="18">0</tspan><tspan x="800" dy="18">ﾛ</tspan><tspan x="800" dy="18">ﾜ</tspan><tspan x="800" dy="18">0</tspan><tspan x="800" dy="18">1</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="835" y="0"><tspan x="835" dy="18">ﾝ</tspan><tspan x="835" dy="18">1</tspan><tspan x="835" dy="18">0</tspan><tspan x="835" dy="18">ｱ</tspan><tspan x="835" dy="18">ｲ</tspan><tspan x="835" dy="18">0</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-190;0,220" dur="3.3s" repeatCount="indefinite"/>
      </text>
      <text x="870" y="0"><tspan x="870" dy="18">0</tspan><tspan x="870" dy="18">1</tspan><tspan x="870" dy="18">ｳ</tspan><tspan x="870" dy="18">0</tspan><tspan x="870" dy="18">1</tspan><tspan x="870" dy="18">ｴ</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-110;0,220" dur="2.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Clean title, no glitch -->
    <g font-family="'Courier New', monospace" font-weight="bold" font-size="32" text-anchor="middle" fill="#00ff41" filter="url(#glow)">
      <text x="450" y="70">LUIZ HENRIQUE</text>
      <text x="450" y="112">DA SILVA MACHADO</text>
    </g>

    <text x="450" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#00ff41" opacity="0.85">
      Software Engineering | Full-Stack | Data Engineering
    </text>

    <!-- scanline -->
    <g opacity="0.1">
      <line x1="0" y1="0" x2="900" y2="0" stroke="#00ff41" stroke-width="1">
        <animate attributeName="y1" values="0;200" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;200" dur="2.5s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>
